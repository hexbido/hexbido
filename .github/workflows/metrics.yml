name: Metrics
on:
  # 🌏 Updated Every 24 Hours (Midnight GMT)
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # -----------------------------------------------------------------
      # 1️⃣ Core Stats Section - [Placed at the top]
      # 1 : It clCovers The Following Elements: 1 (Classic), 9 (Followup), 14 (Activity)
      # -----------------------------------------------------------------
      - name: 1. Core Stats (Header, Activity, Followup)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.core.svg
          token: ${{ secrets.HEXBIDO_TOKENS }}
          base: header, activity, community, repositories, metadata
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_followup: yes
          plugin_followup_sections: repositories

      # -----------------------------------------------------------------
      # 2️⃣ Languages and Technologies (Tech Stack) Department - [Left]
      # 2 : It Covers The Following Elements: 2 (In-depth), 3 (Recent), 6 (Topics)
      # -----------------------------------------------------------------
      - name: 2. Tech Stack (Languages & Topics)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.tech.svg
          token: ${{ secrets.HEXBIDO_TOKENS }}
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell,
            gnuplot
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_topics: yes
          plugin_topics_limit: 12
          plugin_topics_mode: icons

      # -----------------------------------------------------------------
      # 3️⃣ Habit & Time Section - [Right]
      # 4 : Covers Elements: 4 (IsoCalendar), 7, 8 (Habits)
      # Note: WakaTime (number 18) requires a special token; we will add it later.
      # -----------------------------------------------------------------
      - name: 3. Habits & Time (IsoCalendar & Habits)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.habits.svg
          token: ${{ secrets.HEXBIDO_TOKENS }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: Africa/Cairo

      # -----------------------------------------------------------------
      # 4️⃣ Projects & Content Section - [Below]
      # 5 : Covers the following items: 5 (Stars), 11 (Pinned), 12, 13 (StarLists), 15 (Projects)
      # Note: PageSpeed ​​(number 16) requires a special token
      # -----------------------------------------------------------------
      - name: 4. Projects & Content (Repos, Stars, Lists)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.content.svg
          token: ${{ secrets.HEXBIDO_TOKENS }}
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 4
          plugin_starlists: yes
          plugin_starlists_limit: 2
          plugin_starlists_limit_languages: 8
          plugin_starlists_languages: yes
          plugin_stars: yes
          plugin_stars_limit: 4
